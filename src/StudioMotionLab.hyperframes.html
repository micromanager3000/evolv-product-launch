<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta data-composition-id="StudioMotionLab" data-width="1920" data-height="1080">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      * { box-sizing: border-box; }
      [data-hf-id="canvas"] { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: white; font-family: Inter, system-ui, sans-serif; }
      [data-hf-id="title"] { position: absolute; left: 120px; top: 120px; margin: 0; font-size: 96px; line-height: 1; }
    </style>
  </head>
  <body>
    <main data-hf-id="canvas" data-composition-id="StudioMotionLab" data-width="1920" data-height="1080" data-duration="5">
      <h1 style="left: 160px; top: 160px; color: #78e1ce; font-size: 96px" data-hf-id="title" data-hf-layer="" data-start="0.25" data-duration="4.5">Made to move. UI + MCP.</h1>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script data-hf-gsap="">
      const timeline = gsap.timeline({ paused: true });
      const layers = typeof queryAll === "function"
        ? queryAll("[data-hf-layer]")
        : document.querySelectorAll("[data-hf-layer]");
      layers.forEach((element) => {
        timeline.from(element, { opacity: 0, y: 24, duration: 0.45, ease: "power2.out" }, Number(element.dataset.start || 0));
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["StudioMotionLab"] = timeline;
    </script>
  </body>
</html>
