<!doctype html><html><head><style>
 [data-fd-composition]{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#122436 0%,#0D1B2A 52%,#070e18 100%);color:#F5F2EE;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif}
 .pack{position:absolute;left:50%;top:96px;width:880px;height:495px;margin-left:-440px;border-radius:18px;overflow:hidden;opacity:.9}
 .pack .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 30%,#0D1B2A 92%)}
 .logo-slot{position:absolute;left:0;right:0;top:462px;height:150px}
 .tagline{position:absolute;left:0;right:0;top:660px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:46px;font-weight:600;letter-spacing:.5px}
 .tagline i{color:#00B4B4;font-style:normal}
 .wavebar{position:absolute;left:0;right:0;top:756px;height:110px}
 .wavebar svg{position:absolute;inset:0;width:100%;height:100%}
 .cta{position:absolute;left:50%;top:894px;transform:translateX(-50%);font:800 15px ui-monospace;letter-spacing:2.4px;color:#0D1B2A;background:#F5F2EE;border-radius:999px;padding:15px 34px}
 .site{position:absolute;left:0;right:0;top:972px;text-align:center;font:12.5px ui-monospace;letter-spacing:2px;color:#9CA3AF}
</style></head><body>
<!-- The closer. The pack shot uses the exact Drive product photograph; launch-edit lays the real
     wordmark (asset://logo-white) into .logo-slot's rect, so the logo stays a byte-true
     asset rather than a redraw. Standalone, the card still reads without it. -->
<main data-fd-composition data-fd-id="EndCard" data-fd-name="Evolv28 — end card" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="150" data-fd-kind="scene" data-fd-library="true" data-fd-source="src/compositions/EndCard.html" data-fd-module="src/compositions/EndCard.ts" data-fd-export="endCardComp">
 <div class="pack"><img data-fd-clip data-fd-id="endcard-pack" data-fd-name="pack shot · exact device photo" data-fd-from="0" data-fd-duration="150" data-fd-type="image" data-fd-src="asset://evolv-device-hero-photo" data-fd-fit="cover" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="veil"></div></div>
 <div class="logo-slot" data-fd-id="endcard-logo-slot"></div>
 <h1 class="tagline" data-fd-id="endcard-tagline">Calm, <i>by design.</i></h1>
 <div class="wavebar"><svg viewBox="0 0 1920 110"><polyline id="endwave" points="" fill="none" stroke="#00B4B4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg></div>
 <div class="cta" data-fd-id="endcard-cta">GET YOURS TODAY</div>
 <div class="site" data-fd-id="endcard-site">EVOLV28.COM · THE INSOMNIA INTELLIGENCE COMPANY</div>
 <script>
  const wave=query("#endwave"),tag=query(".tagline"),cta=query(".cta"),site=query(".site"),pack=query(".pack");
  const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
  onFrame(({frame})=>{
   // one calm alpha line draws across, then keeps breathing
   const draw=ease(frame/45);
   const pts=[];
   for(let x=0;x<=1920*draw;x+=8){
    pts.push(x+","+(55+Math.sin(x*.0165-frame*.16)*30).toFixed(1));
   }
   wave.setAttribute("points",pts.join(" "));
   pack.style.opacity=String(.25+.65*ease(frame/30));
   tag.style.opacity=String(ease((frame-24)/26));
   tag.style.transform=`translateY(${12*(1-ease((frame-24)/26))}px)`;
   cta.style.opacity=String(ease((frame-56)/24));
   cta.style.transform=`translateX(-50%) scale(${.94+.06*ease((frame-56)/24)})`;
   site.style.opacity=String(.85*ease((frame-76)/24));
  });
 </script>
</main></body></html>
