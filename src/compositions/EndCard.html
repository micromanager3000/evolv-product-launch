<!doctype html><html><head><style>
 [data-fd-composition]{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#17344a 0%,#0B1B2B 52%,#06101B 100%);color:#F5F2EE;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif}
 [data-fd-composition]:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,10,18,.08),transparent 48%,rgba(2,9,16,.4));pointer-events:none}
 .pack{position:absolute;left:240px;top:74px;width:1440px;height:810px;border-radius:38px;overflow:hidden;opacity:.96;border:1px solid rgba(121,231,227,.2);box-shadow:0 42px 120px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
 .pack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .pack .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,13,22,.34),transparent 28%,transparent 68%,rgba(4,12,20,.46))}
 .logo-slot{position:absolute;left:720px;top:54px;width:480px;height:112px}
 .tagline{position:absolute;left:0;top:912px;width:1920px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:72px;line-height:1;font-weight:600;letter-spacing:-1.8px}
 .tagline i{color:#00B4B4;font-style:normal}
</style></head><body>
<!-- The closer. The generated hero preserves the manufacturer device while restaging its background;
     launch-edit lays the real wordmark (asset://logo-white) into .logo-slot's rect, so the logo
     stays a byte-true asset rather than a redraw. Standalone, the card still reads without it. -->
<main data-fd-composition data-fd-id="EndCard" data-fd-name="Evolv28 — end card" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="150" data-fd-kind="scene" data-fd-library="true" data-fd-source="src/compositions/EndCard.html" data-fd-document="src/compositions/EndCard.comp.json" data-fd-module="src/compositions/EndCard.ts" data-fd-export="endCardComp">
 <div class="pack"><img data-fd-clip data-fd-id="endcard-pack" data-fd-name="pack shot · cinematic device hero" data-fd-from="0" data-fd-duration="150" data-fd-type="image" data-fd-src="asset://evolv-device-hero-rings" data-fd-fit="cover"><div class="veil"></div></div>
 <div class="logo-slot" data-fd-id="endcard-logo-slot"></div>
 <h1 class="tagline" data-fd-id="endcard-tagline"><span></span><i></i></h1>
 <script>
  const tag=query(".tagline"),pack=query(".pack");
  let data=document;const applyData=next=>{data=next;query(".tagline span").textContent=data.tagline.lead;query(".tagline i").textContent=data.tagline.accent;};applyData(data);onDocument(applyData);
  const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
  onFrame(({frame})=>{
   pack.style.opacity=String(.25+.65*ease((frame-data.timing.pack)/30));
   tag.style.opacity=String(ease((frame-data.timing.tagline)/26));tag.style.transform=`translateY(${12*(1-ease((frame-data.timing.tagline)/26))}px)`;
  });
 </script>
</main></body></html>
