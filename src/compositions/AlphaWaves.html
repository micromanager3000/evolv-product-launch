<!doctype html><html><head><style>
 [data-fd-composition]{position:relative;overflow:hidden;background:transparent;color:#F5F2EE;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif}
 .band{position:absolute;left:96px;right:96px;top:724px;height:270px;overflow:hidden;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.05);border-radius:18px;background:linear-gradient(180deg,rgba(7,20,31,.08),rgba(7,20,31,.62));mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
 .band svg{position:absolute;left:0;right:0;top:4px;width:100%;height:266px;overflow:hidden;filter:drop-shadow(0 0 10px rgba(121,231,227,.12))}
 .lbl{position:absolute;bottom:16px;font:820 18px ui-monospace;letter-spacing:1.35px;padding:10px 16px;border-radius:12px;background:rgba(7,20,31,.96);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.24);text-shadow:0 1px 8px rgba(0,0,0,.7)}
 .lbl.beta{left:26px;color:#F6B85F;border-color:rgba(246,184,95,.34)}
 .lbl.alpha{right:26px;color:#79E7E3;border-color:rgba(121,231,227,.34)}
 .hz{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;font:820 17px ui-monospace;letter-spacing:1.2px;color:#F7FAFC;background:rgba(7,20,31,.96);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.24);text-shadow:0 1px 8px rgba(0,0,0,.7)}
</style></head><body>
<!-- Alpha overlay: composites over the product reveal in launch-edit. One polyline morphs from
     jagged beta to a smooth 10 Hz alpha sine as the field "takes"; everything is a pure
     function of the frame, so scrub/preview/export agree exactly. -->
<main data-fd-composition data-fd-id="AlphaWaves" data-fd-name="Beta→alpha wave overlay" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="450" data-fd-kind="scene" data-fd-library="true" data-fd-alpha="true" data-fd-timeline="hidden" data-fd-transport="always" data-fd-source="src/compositions/AlphaWaves.html" data-fd-document="src/compositions/AlphaWaves.comp.json" data-fd-module="src/compositions/AlphaWaves.ts" data-fd-export="alphaWavesComp">
 <div class="band">
  <svg viewBox="0 0 1920 340">
   <line x1="0" y1="170" x2="1920" y2="170" stroke="rgba(245,242,238,.1)" stroke-width="1" stroke-dasharray="3 10"/>
   <polyline id="trace" points="" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
   <polyline id="ghost" points="" fill="none" stroke="#F59E0B" stroke-width="1.25" opacity=".18" stroke-linejoin="round"/>
  </svg>
  <span class="lbl beta" data-fd-id="wave-beta-label"></span><span class="lbl alpha" data-fd-id="wave-alpha-label"></span><span class="hz" data-fd-id="wave-field-label"></span>
 </div>
 <script>
  const trace=query("#trace"),ghost=query("#ghost"),beta=query(".lbl.beta"),alpha=query(".lbl.alpha"),hz=query(".hz");
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let data=document;
  const applyData=next=>{data=next;beta.textContent=data.labels.beta;alpha.textContent=data.labels.alpha;hz.textContent=data.labels.field;};
  applyData(data);onDocument(applyData);
  onFrame(({frame})=>{
   // settle progress: hold beta 0–60, morph 60–330, hold alpha to the end
   const p=ease(Math.max(0,Math.min(1,(frame-data.timing.settleFrom)/data.timing.settleDuration)));
   const pts=[],ghostPts=[];
   for(let x=0;x<=1920;x+=8){
    // beta: fast, cluttered with harmonics · alpha: one slow clean sine — blended by p
    const betaY=Math.sin(x*data.wave.betaPrimary+frame*.62)*30+Math.sin(x*data.wave.betaSecondary+frame*.94)*16+Math.sin(x*data.wave.betaTertiary-frame*.37)*12;
    const alphaY=Math.sin(x*data.wave.alpha-frame*.21)*62;
    const y=170+betaY*(1-p)+alphaY*p;
    pts.push(x+","+y.toFixed(1));
    ghostPts.push(x+","+(170+(betaY*(1-p)+alphaY*p)*1.35).toFixed(1));
   }
   trace.setAttribute("points",pts.join(" "));
   ghost.setAttribute("points",ghostPts.join(" "));
   // amber → teal as the rhythm settles
   const r=Math.round(245-245*p),g=Math.round(158+22*p),b=Math.round(11+169*p);
   trace.setAttribute("stroke",`rgb(${r},${g},${b})`);ghost.setAttribute("stroke",`rgb(${r},${g},${b})`);
   beta.style.opacity=String(1-p*.85);
   alpha.style.opacity=String(.15+p*.85);
   hz.style.opacity=String(Math.max(0,Math.min(1,(frame-data.timing.fieldFrom)/data.timing.fieldFadeDuration)));
  });
 </script>
</main></body></html>
